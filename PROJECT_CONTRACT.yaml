version: "1.0.0"
requirements:
  C01: [Membership discovery comes first. Unknown and tentative groups are eligible., agent and finalizer, test_agent]
  C02: [Retain every input cell including outliers and zero profiles., prepare and finalizer, test_prepare and test_agent]
  C03: [Keep distinct stable seeds and original barcodes for each singleton., prepare, test_prepare]
  C04: [Search all cells across coarse classes. Reject or revise labels freely., science and agent, test_science]
  C05: [Candidates may overlap. Final assignment covers each input ID exactly once., finalizer, test_agent]
  C06: [Only the OntoAnno preprocessing module provides initial annotations., annotation, test_integrations]
  C07: [Bind calculations and decisions to versioned objects and evidence parents., state and agent, test_state and test_agent]
  C08: [Repeated requests or interpretations do not increase independent support., state and agent, test_state and test_agent]
  C09: [Treat marker-selected enrichment as selection-dependent., science and state, test_science and test_state]
  C10: [Discovery has no access to reference labels or target feedback., data and protocol, test_prepare and test_agent]
  C11: [Resume from persistent scientific and communication state., state and agent, test_state and test_agent]
  C12: [Normalize equivalent requests while preserving exact entity identity and scientific scope., protocol, test_protocol]
  C13: [Record concrete changes. Repetition alone does not advance an investigation., agent, test_agent]
  C14: [Give concise evidence and specific uncertainty or failure. Avoid repeated background., agent and protocol, test_protocol and test_agent]
  C15: [A retrieval budget is an upper bound. Allow no additions., science, test_science]
  C16: [Use scores and stable IDs when ordering or truncating., views and science, test_science and test_prepare]
  C17: [Record blocked or incomplete stages and the actual algorithms and providers used., cli and integrations, test_integrations and test_agent]
